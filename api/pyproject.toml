[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "px"
version = "0.1.0"
description = "Portfolio X-Ray API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.0",
  "uvicorn[standard]>=0.30.0",
  "anthropic>=0.40.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
  "bandit>=1.7",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
# Invoked from repo root via: pytest -c api/pyproject.toml
markers = [
  "privacy: privacy boundary tests (SPEC D9 / weight-only)",
]
testpaths = ["../tests"]
