name: Agent task
description: A queued task an agent can pick up and finish unattended
labels: ["ready"]
body:
  - type: dropdown
    id: lane
    attributes:
      label: Lane
      options:
        - lane-a (interactive, Claude Code)
        - lane-b (cloud agent, PR only)
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: One sentence. If it needs two, it is two issues.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Machine-checkable. A command that exits 0, or an assertion that holds.
      placeholder: |
        - `pytest tests/test_risk.py` passes
        - Σ RC% = 1.0 ± 1e-6 for all golden portfolios
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec reference
      placeholder: "docs/SPEC.md §5.5 M3"
  - type: textarea
    id: outofscope
    attributes:
      label: Explicitly out of scope
      description: What an agent might reasonably add that it must not.
