name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI never holds an Anthropic API key. Every check below runs offline against
# recorded fixtures. If a check needs a live model call, it does not belong in CI.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, tests, golden portfolios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "api[dev]"
      - name: Lint
        run: |
          ruff check api tests scripts
          if [ -d evals ]; then ruff check evals; fi
      - name: Unit and golden-portfolio tests
        run: pytest -c api/pyproject.toml -v --tb=short
      - name: Privacy boundary (D9)
        run: |
          set +e
          pytest -c api/pyproject.toml -m privacy -v
          ec=$?
          set -e
          # Exit code 5 = no tests collected yet (scaffold). Treat as pass until D9 tests exist.
          if [ "$ec" -eq 0 ] || [ "$ec" -eq 5 ]; then
            exit 0
          fi
          exit "$ec"

  extraction-eval:
    name: Extraction eval (offline fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # hashFiles is valid on steps, not on job-level if: (GitHub Actions limitation).
      - name: Skip when evals/ absent
        if: hashFiles('evals/run_eval.py') == ''
        run: echo "evals/ not present yet — extraction-eval no-op success"
      - uses: actions/setup-python@v5
        if: hashFiles('evals/run_eval.py') != ''
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install
        if: hashFiles('evals/run_eval.py') != ''
        run: pip install -e "api[dev]"
      - name: Run eval
        if: hashFiles('evals/run_eval.py') != ''
        run: python evals/run_eval.py --offline --fail-under-f1 0.95 --max-weight-mae 1.0
      - uses: actions/upload-artifact@v4
        if: hashFiles('evals/run_eval.py') != '' && always()
        with:
          name: extraction-scorecard
          path: evals/history/

  frontend:
    name: Frontend — types, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip when web/ absent
        if: hashFiles('web/package.json') == ''
        run: echo "web/ not present yet — frontend no-op success"
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci
      - name: Typecheck
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npx tsc --noEmit
      - name: Lint
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run lint
      - name: Unit tests (image prepare)
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm test
      - name: Build
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run build

  design-tokens:
    name: Design tokens and currency ban
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip when web/ absent
        if: hashFiles('web/package.json') == ''
        run: echo "web/ not present yet — design-tokens no-op success"
      - name: No stray hex colors outside tokens.css
        if: hashFiles('web/package.json') != ''
        run: |
          if grep -rEn --include='*.tsx' --include='*.ts' --include='*.css' \
             --exclude='tokens.css' '#[0-9a-fA-F]{3,8}\b' web/; then
            echo "::error::Hex color outside tokens.css. Use a design token (SPEC 5.11)."
            exit 1
          fi
      - name: No border-radius or box-shadow
        if: hashFiles('web/package.json') != ''
        run: |
          if grep -rEn --include='*.tsx' --include='*.css' \
             '(border-radius|box-shadow|rounded-|shadow-)' web/; then
            echo "::error::border-radius / box-shadow are banned (SPEC 5.11)."
            exit 1
          fi
      - name: No currency in the frontend
        if: hashFiles('web/package.json') != ''
        run: |
          if grep -rEn --include='*.tsx' --include='*.ts' \
             '(currency|\$\{?[0-9]|USD|toLocaleString.*currency)' web/; then
            echo "::error::Frontend receives weights only. No currency (SPEC 6.2)."
            exit 1
          fi

  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip
          pip install -e "api[dev]"
          pip install pip-audit
          # Soft-fail: advisory noise must not block scaffold; harden later.
          pip-audit || true
      - name: Static analysis
        run: |
          pip install bandit
          bandit -r api/src -ll
      - name: No real screenshots committed
        run: |
          if [ -f evals/labels.json ] && ! grep -q '"synthetic": *true' evals/labels.json; then
            echo "::error::evals/labels.json must declare synthetic: true. Real account screenshots must never enter this repo."
            exit 1
          fi
